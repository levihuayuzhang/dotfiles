[backdrop]
enabled = true

[bar.default]
background_opacity = 0.0
capsule = true
end = [
    "audio_visualizer",
    "media",
    "tray",
    "group:g1",
    "weather",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "clipboard",
    "notifications",
    "control-center",
    "session"
]
margin_ends = 0
shadow = false
start = [ "NixOS", "workspaces", "active_window" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network_rx", "network_tx", "cpu", "ram", "temp" ]
    opacity = 1.0
    padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1280.0
    cy = 720.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Haikou, China"

[lockscreen]
fingerprint = false
wallpaper = "/home/zhy/wallpapers/mrx.png"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-1",
    "lockscreen-login-box@eDP-2",
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@HDMI-A-1",
